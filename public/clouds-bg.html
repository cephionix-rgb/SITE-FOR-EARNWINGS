<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EARNWINGS sky</title>
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #EAF4FF 0%, #D9EAFC 38%, #C9E0F8 66%, #E8F2FF 100%);
    }
    /* soft sun glow, high on the right — also breathes */
    .sun {
      position: fixed;
      left: 74%; top: 6%;
      width: 54vmax; height: 54vmax;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255,247,220,0.9) 0%,
        rgba(245,217,122,0.32) 28%,
        rgba(245,217,122,0.09) 46%,
        transparent 62%);
      filter: blur(6px);
      animation: sunPulse 20s ease-in-out infinite alternate;
    }
    @keyframes sunPulse { from { opacity: .8; transform: translate(-50%,-50%) scale(1); } to { opacity: 1; transform: translate(-50%,-50%) scale(1.12); } }

    /* Full-viewport cloud plates — `cover`, so there is NO tiling edge or seam.
       Each is larger than the screen, softly blurred, and DRIFTS + BREATHES
       (translate + scale so the clouds visibly move, expand and contract). */
    .cloud {
      position: fixed;
      inset: -18%;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-image: url('/assets/hero-clouds.png');
      filter: blur(1.5px);
      will-change: transform;
    }
    .c1 { opacity: .50; animation: drift1 46s ease-in-out infinite alternate; }
    .c2 { opacity: .60; animation: drift2 36s ease-in-out infinite alternate; }
    .c3 { opacity: .40; animation: drift3 58s ease-in-out infinite alternate; }
    @keyframes drift1 { 0% { transform: translate(-3%,-1%) scale(1.06); } 50% { transform: translate(1%,1%) scale(1.18); } 100% { transform: translate(3%,-1%) scale(1.06); } }
    @keyframes drift2 { 0% { transform: translate(3%,1%) scale(1.10); }  50% { transform: translate(-1%,-1%) scale(1.22); } 100% { transform: translate(-3%,1%) scale(1.10); } }
    @keyframes drift3 { 0% { transform: translate(-2%,2%) scale(1.16); } 50% { transform: translate(1%,-1%) scale(1.05); } 100% { transform: translate(2%,2%) scale(1.16); } }

    /* airy readability wash so page text over the sky stays crisp */
    .wash { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(244,249,255,0.34) 0%, rgba(244,249,255,0.14) 45%, rgba(244,249,255,0.36) 100%); }
    /* Mobile: drop the GPU-heavy blur + one layer + sun pulse so scrolling stays smooth */
    @media (max-width: 768px) {
      .cloud { filter: none; }
      .c3 { display: none; }
      .sun { animation: none; }
    }
    @media (prefers-reduced-motion: reduce) { .cloud, .sun { animation: none; } }
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="cloud c3"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="wash"></div>
</body>
</html>
