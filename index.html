<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EBF3FF" />

    <!-- Home-route SEO. scripts/gen-routes.mjs (postbuild) rewrites the title,
         description, canonical and og/twitter tags per route for /features,
         /about, /privacy and /terms. Keep these single-line so the regex holds. -->
    <title>EARNWINGS — DGCA Ground Classes &amp; Pilot Exam Prep App</title>
    <meta name="description" content="EARNWINGS is the student pilot app for DGCA CPL and ATPL: online ground classes, 10,000+ practice questions, mock exams, real-airway flight planning, an RT trainer and an AI Captain." />
    <link rel="canonical" href="https://earnwings.org/" />

    <meta property="og:site_name" content="EARNWINGS" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://earnwings.org/" />
    <meta property="og:title" content="EARNWINGS — DGCA Ground Classes and Pilot Exam Prep App" />
    <meta property="og:description" content="Pass DGCA faster. Real-airway flight planning, RT trainer, AI Captain and full mock exams in one app." />
    <meta property="og:image" content="https://earnwings.org/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EARNWINGS — Pass DGCA faster. Fly sooner." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EARNWINGS — DGCA Ground Classes and Pilot Exam Prep App" />
    <meta name="twitter:description" content="Pass DGCA faster. Flight planning, RT trainer, AI Captain and mock exams in one app." />
    <meta name="twitter:image" content="https://earnwings.org/assets/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts loaded non-render-blocking (display=swap paints system fallback
         first, then swaps) so they do not delay FCP/LCP. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&family=Sora:wght@600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Preload the LCP intro poster (only the variant matching the viewport). -->
    <link rel="preload" as="image" href="/assets/intro-poster-1920.jpg" media="(min-width: 768px)" />
    <link rel="preload" as="image" href="/assets/paper-airplane-mobile-poster.jpg" media="(max-width: 767px)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
