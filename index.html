<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons are generated by scripts/make-favicons.mjs (npm run favicons): the
         plane mark on a white circle. The ?v= is a cache-buster — browsers cache
         favicons far more stubbornly than pages, so without it returning
         visitors keep the old icon. 48px matters: Google only shows a favicon
         beside a search result if one is a multiple of 48px square. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7FAFF" />

    <!-- Home-route SEO. scripts/gen-routes.mjs (postbuild) rewrites the title,
         description, canonical and og/twitter tags per route for /features,
         /about, /privacy and /terms. Keep these single-line so the regex holds. -->
    <title>EARNWINGS — DGCA Ground Classes &amp; Pilot Exam Prep App</title>
    <meta name="description" content="EARNWINGS is the student pilot app for DGCA CPL: notes, flowcharts, 15,000+ practice questions and timed mock papers, RT practice in 3D airports and an A320 flight-deck trainer." />
    <link rel="canonical" href="https://earnwings.org/" />

    <meta property="og:site_name" content="EARNWINGS" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://earnwings.org/" />
    <meta property="og:title" content="EARNWINGS — DGCA Ground Classes and Pilot Exam Prep App" />
    <meta property="og:description" content="Pass DGCA faster. DGCA ground school, voice RT practice in real 3D airports and an A320 flight-deck trainer, in one app." />
    <meta property="og:image" content="https://earnwings.org/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EARNWINGS — Pass DGCA faster. Fly sooner." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EARNWINGS — DGCA Ground Classes and Pilot Exam Prep App" />
    <meta name="twitter:description" content="Pass DGCA faster. Ground school, voice RT practice and an A320 flight-deck trainer in one app." />
    <meta name="twitter:image" content="https://earnwings.org/assets/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts loaded non-render-blocking (display=swap paints system fallback
         first, then swaps) so they do not delay FCP/LCP. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Preload the LCP image (the hero poster), one variant per layout. -->
    <!-- Hero film posters (the hero's LCP image): one per layout, WebP. -->
    <link rel="preload" as="image" type="image/webp" href="/media/hero/hero-loop-1920x1080-poster.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/media/hero/hero-loop-1080x1350-poster.webp" media="(max-width: 767px)" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
